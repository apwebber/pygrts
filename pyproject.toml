[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygrts"
dynamic = ["version"]
description = "A library for geospatial sampling"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.8,<3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "geopandas>=0.8.0",
    "numpy>=1.19.0",
    "pandas>=1.0.5",
    "pyproj>=3.0.0",
    "scikit-learn>=0.23.1",
    "scipy>=1.5.1",
    "shapely>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/jgrss/pygrts"

[project.optional-dependencies]
tests = [
    "testfixtures",
    "pre-commit",
    "black",
    "flake8",
    "docformatter",
    "isort",
    "rtree>=1.0.1",
]

[tool.hatch.version]
path = "src/pygrts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pygrts"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vscode
  | \.idea
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
